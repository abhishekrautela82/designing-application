name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (root, if package.json)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: |
          if npm run -s test --if-present; then
            echo "Tests ran"
          else
            echo "No tests configured"
          fi

  backend:
    name: Backend (Node, if backend/package.json)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/package.json') != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run -s lint
      - name: Build
        run: npm run -s build

  python:
    name: Python (if pyproject/requirements)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('pyproject.toml', 'requirements.txt') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install pytest || true
      - name: Test
        run: |
          if [ -d tests ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            pytest -q || pytest
          else
            echo "No Python test config detected"
          fi

  dotnet:
    name: .NET (if *.sln/*.csproj)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.fsproj') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build

  sanity:
    name: Sanity (always)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List tracked files
        run: |
          echo "Tracked files:" 
          git ls-files
