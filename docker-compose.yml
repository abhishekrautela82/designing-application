services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: designing_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/designing-app || true;
      mc anonymous set download local/designing-app || true;
      echo 'MinIO bucket ready';
      "

  backend:
    build:
      context: ./backend
    depends_on:
      - redis
      - postgres
      - minio
      - minio-init
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: info
      JWT_SECRET: change-me-change-me-change-me
      DATABASE_URL: postgresql://app:app@postgres:5432/designing_app?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: designing-app
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./backend
    depends_on:
      - redis
      - postgres
      - minio
      - minio-init
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/designing_app?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: designing-app
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: change-me-change-me-change-me
      LOG_LEVEL: info
      HOST: 0.0.0.0
      PORT: 8080
    command: ["node", "dist/worker.js"]

volumes:
  pgdata:
  miniodata:
